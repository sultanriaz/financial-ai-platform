# FIX #11: Added finai-api, finai-scraper, and finai-consumer services so that
# "docker compose up -d" actually starts the full stack, not just infrastructure.
# The original file only started Zookeeper, Kafka, kafka-init, Postgres, and Ollama.
services:
  # ─── infrastructure ─────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: finai-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat"
    ports: ["2181:2181"]
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2181"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: finai-kafka
    restart: unless-stopped
    depends_on:
      zookeeper: { condition: service_healthy }
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: finai-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in financial-news-raw financial-news-analysis financial-news-results financial-news-dlq; do
          echo "Creating $$topic"
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Topics ready"

  postgres:
    image: postgres:16-alpine
    container_name: finai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_ai
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: finai-ollama
    profiles: [local-ai]
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]

  # ─── application services ────────────────────────────────────────────────────
  finai-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finai-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      KAFKA_URL: kafka:29092           # internal broker address
      DATABASE_URL: postgresql+asyncpg://financial:financial@finai-postgres:5432/financial_ai
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/system-status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  finai-scraper:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finai-scraper
    restart: unless-stopped
    command: ["python", "-m", "scraper.rss_worker"]
    depends_on:
      kafka: { condition: service_healthy }
    env_file: .env
    environment:
      KAFKA_URL: kafka:29092

  finai-consumer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finai-consumer
    restart: unless-stopped
    command: ["python", "-m", "ai_engine.consumer"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    env_file: .env
    environment:
      KAFKA_URL: kafka:29092
      DATABASE_URL: postgresql+asyncpg://financial:financial@finai-postgres:5432/financial_ai
      # Point at the host Ollama if not using the local-ai profile:
      OLLAMA_URL: http://host.docker.internal:11434

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  ollama-data:
